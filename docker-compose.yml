services:

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shareboard
      MYSQL_USER: shareboard_user
      MYSQL_PASSWORD: shareboard_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./SB_server/sql:/docker-entrypoint-initdb.d

    # Check that MySQL is actually ready to accept connections.
    # This prevents the backend from trying to connect too early.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./SB_server
    restart: always

    # Wait for MySQL to become healthy before starting the backend.
    # depends_on by itself only controls startup order, not readiness.
    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://db:3306/shareboard
      DB_USERNAME: shareboard_user
      DB_PASSWORD: shareboard_pass
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./SB_client
      args:
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data: