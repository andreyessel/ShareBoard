name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: shareboard
          MYSQL_USER: shareboard_user
          MYSQL_PASSWORD: shareboard_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/shareboard?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: shareboard_user
      DB_PASSWORD: shareboard_pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SB_server/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h 127.0.0.1 -u root -prootpassword && break
            echo "Waiting for MySQL..."
            sleep 3
          done

      - name: Load schema and seed data
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword shareboard < SB_server/sql/01-schema.sql
          mysql -h 127.0.0.1 -u root -prootpassword shareboard < SB_server/sql/02-seed.sql

      - name: Build and start the backend
        working-directory: SB_server
        run: |
          mvn -B -DskipTests package
          nohup mvn spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for the backend to be up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/categories && break
            echo "Waiting for the backend to start..."
            sleep 3
          done

      - name: Install frontend dependencies
        working-directory: SB_client
        run: npm ci

      # Build the frontend against the backend running on localhost -
      # matches how the Playwright config expects to reach the API.
      - name: Build the frontend
        working-directory: SB_client
        env:
          VITE_API_URL: http://localhost:8080
          VITE_WS_URL: ws://localhost:8080/ws
        run: npm run build

      - name: Preview the frontend
        working-directory: SB_client
        run: |
          nohup npm run preview -- --port 5173 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for the frontend to be up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            echo "Waiting for the frontend to start..."
            sleep 3
          done

      - name: Install Playwright and browsers
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
        run: npm test

      - name: Show backend logs on failure
        if: failure()
        run: cat SB_server/app.log

      - name: Show frontend logs on failure
        if: failure()
        run: cat SB_client/frontend.log

      - name: Stop backend and frontend
        if: always()
        run: |
          kill $(cat SB_server/app.pid) 2>/dev/null || true
          kill $(cat SB_client/frontend.pid) 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
